name: Gerard Martí Juan
title: Gerard Martí Juan
tagline: 'Medical imaging & machine learning'

# Short bio or description (used in <title> and as the default social description)
description: Machine learning for medical imaging

avatar: /images/profile.jpg

# 1200x630 card used for link previews. Previously this fell back to `avatar`,
# so every shared link previewed a 150px thumbnail.
og_image: /images/og-card.png

author:
  name: Gerard Martí Juan
  # Was declared twice (gmail then upf); the second silently won and ended up in
  # the feed. The personal address is the one advertised everywhere else, and it
  # outlives any affiliation.
  email: gerardmartijuan@gmail.com
  url: https://gerardmjuan.github.io

# Includes an icon in the footer for each username you enter
footer-links:
  email: gerardmartijuan@gmail.com
  github: GerardMJuan
  scholar: 9Qzpt7kAAAAJ
  orcid: 0000-0003-4729-7182
  linkedin: gerardmjuan
  twitter: gerardmjuan
  rss: true

google_analytics:

# Your website URL. Used for Sitemap.xml and your RSS feed.
url: https://gerardmjuan.github.io

# If you're hosting your site at a Project repository on GitHub pages
# (http://yourusername.github.io/repository-name)
# and NOT your User repository (http://yourusername.github.io)
# then add in the baseurl here, like this: "/repository-name"
baseurl: ""
lang: en
timezone: Europe/Madrid

permalink: /:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

sass:
  style: :compressed

tag_page: '/blog/tags/'
category_page: '/blog/categories/'

plugins:
  - jekyll-feed
  - jekyll-sitemap

# No index page links here any more, but the collection stays wired up so
# projects can come back as Markdown files without touching config.
collections:
  projects:
    output: true
    permalink: /projects/:name/

exclude:
  - _drafts
  - CV Base.docx
  - CV Base.pdf
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME
  - vendor
  - .bundle
  - node_modules
  - .vscode
  - scripts

# Opt into browser-side math rendering per page with math: true.
mathjax: false

font-awesome:
  assets: true
