name: Gerard Martí
title: Gerard Martí
tagline: 'My personal website'

# Short bio or description (displayed in the header)
description: Senior AI Researcher | Ph.D. in Medical AI & Neuroimaging

avatar: /images/profile.jpg

author:
  name: Gerard Martí Juan
  email: gerardmartijuan@gmail.com
  url: https://gerardmjuan.github.io
  email: gerard.marti@upf.edu

# Includes an icon in the footer for each username you enter
footer-links:
  dribbble:
  email: gerardmartijuan@gmail.com
  facebook:
  flickr:
  github: GerardMJuan
  instagram:
  linkedin: gerardmjuan
  pinterest:
  rss: true
  twitter: gerardmjuan
  stackoverflow: # your stackoverflow profile, e.g. "users/50476/bart-kiers"
  youtube: # channel/<your_long_string> or user/<user-name>
  googleplus: # anything in your profile username that comes after plus.google.com/

google_analytics:

# Your website URL (e.g. http://barryclark.github.io or http://www.barryclark.co)
# Used for Sitemap.xml and your RSS feed
url: https://gerardmjuan.github.io

# If you're hosting your site at a Project repository on GitHub pages
# (http://yourusername.github.io/repository-name)
# and NOT your User repository (http://yourusername.github.io)
# then add in the baseurl here, like this: "/repository-name"
baseurl: ""
lang: en
timezone: Europe/Madrid

permalink: /:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

sass:
  style: :compressed

paginate: 5
paginate_path: '/blog/page:num'

tag_page: '/blog/tags/'
category_page: '/blog/categories/'

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate

collections:
  projects:
    output: true
    permalink: /projects/:name/

exclude:
  - _drafts
  - CV Base.docx
  - CV Base.pdf
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME
  - vendor
  - .bundle
  - node_modules
  - .vscode
  - scripts

# Opt into browser-side math rendering per page with math: true.
mathjax: false

font-awesome:
  assets: true
