name: Gerard Martí
title: Gerard Martí
tagline: 'My personal website'

# Keep this factual but broad enough to survive changes in role or affiliation.
description: Personal website, research notes, and projects.

avatar: /images/profile.jpg

author:
  name: Gerard Martí
  url: https://gerardmjuan.github.io
  email: gerard.marti@upf.edu

footer-links:
  dribbble:
  email: gerard.marti@upf.edu
  facebook:
  flickr:
  github: GerardMJuan
  instagram:
  linkedin:
  pinterest:
  rss: true
  twitter: gerardmjuan
  stackoverflow: # your stackoverflow profile, e.g. "users/50476/bart-kiers"
  youtube: # channel/<your_long_string> or user/<user-name>
  googleplus: # anything in your profile username that comes after plus.google.com/

google_analytics:

url: https://gerardmjuan.github.io
baseurl: ""
lang: en
timezone: Europe/Madrid

permalink: /:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

sass:
  style: :compressed

paginate: 5
paginate_path: '/blog/page:num'

tag_page: '/blog/tags/'
category_page: '/blog/categories/'

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate

collections:
  projects:
    output: true
    permalink: /projects/:name/

exclude:
  - _drafts
  - LICENSE
  - README.md
  - CNAME
  - vendor
  - .bundle
  - node_modules
  - .vscode
  - scripts

# Opt into browser-side math rendering per page with math: true.
mathjax: false

font-awesome:
  assets: true
