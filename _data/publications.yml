# Publications
#
# Single source of truth: blog/publications.md renders the list from this file,
# and assets/data/publications-vega.json builds the timeline chart from it, so
# adding a paper here updates both.
#
# To refresh from Google Scholar: open your profile, tick the papers, hit
# Export -> BibTeX, save it, then run
#     python3 scripts/import_bibtex.py citations.bib > _data/publications.yml
# and edit the `topic` fields, which BibTeX does not carry.
#
# ---------------------------------------------------------------------------
