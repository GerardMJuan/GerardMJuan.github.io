<!-- Code Copy Buttons -->
<script>
  (function() {
    // Add copy buttons to all code blocks
    document.addEventListener('DOMContentLoaded', function() {
      const codeBlocks = document.querySelectorAll('pre code, div.highlight pre, figure.highlight pre');

      codeBlocks.forEach(function(codeBlock) {
        // Get the parent pre element or the highlight container
        const pre = codeBlock.closest('pre') || codeBlock.parentElement;
        if (!pre || pre.querySelector('.copy-button')) return;

        // Create wrapper if needed
        let wrapper = pre.parentElement;
        if (!wrapper.classList.contains('code-wrapper')) {
          wrapper = document.createElement('div');
          wrapper.className = 'code-wrapper';
          pre.parentNode.insertBefore(wrapper, pre);
          wrapper.appendChild(pre);
        }

        // Create copy button
        const button = document.createElement('button');
        button.className = 'copy-button';
        button.textContent = 'Copy';
        button.setAttribute('aria-label', 'Copy code to clipboard');

        // Add click handler
        button.addEventListener('click', function() {
          const code = codeBlock.textContent || codeBlock.innerText;

          navigator.clipboard.writeText(code).then(function() {
            button.textContent = 'Copied!';
            button.classList.add('copied');

            setTimeout(function() {
              button.textContent = 'Copy';
              button.classList.remove('copied');
            }, 2000);
          }).catch(function(err) {
            console.error('Failed to copy:', err);
            button.textContent = 'Failed';
            setTimeout(function() {
              button.textContent = 'Copy';
            }, 2000);
          });
        });

        wrapper.appendChild(button);
      });
    });
  })();
</script>
