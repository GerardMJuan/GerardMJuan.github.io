{% if page.math or page.mathjax or site.mathjax %}
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
{% endif %}

{% if page.mermaid %}
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

    mermaid.initialize({
      startOnLoad: false,
      securityLevel: 'strict'
    });

    mermaid.run({ querySelector: '.mermaid' });
  </script>
{% endif %}

{% if page.vega_lite %}
  <script defer src="https://cdn.jsdelivr.net/npm/vega@6.2.0"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/vega-lite@6.4.3"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/vega-embed@7.1.0"></script>
  <script defer src="{{ '/assets/js/vega-lite.js' | relative_url }}"></script>
{% endif %}

{% if page.plotly %}
  <script defer src="https://cdn.plot.ly/plotly-3.6.0.min.js"></script>
  <script defer src="{{ '/assets/js/plotly.js' | relative_url }}"></script>
{% endif %}
