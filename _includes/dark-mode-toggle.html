{%- comment -%}
  Button markup lives in _layouts/default.html so it can sit inside the
  masthead. This include only wires up the behaviour; the theme itself is
  already resolved by the inline <head> script before first paint.
{%- endcomment -%}
<script>
  (function () {
    const themeToggle = document.getElementById('theme-toggle');
    if (!themeToggle) { return; }

    const moonIcon = document.getElementById('moon-icon');
    const sunIcon = document.getElementById('sun-icon');
    const htmlElement = document.documentElement;

    function render(theme) {
      const dark = theme === 'dark';
      moonIcon.style.display = dark ? 'none' : 'block';
      sunIcon.style.display = dark ? 'block' : 'none';
      themeToggle.setAttribute('aria-pressed', dark ? 'true' : 'false');
      themeToggle.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
    }

    // Sync the button with whatever the <head> script already applied.
    render(htmlElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');

    themeToggle.addEventListener('click', function () {
      const next = htmlElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';

      if (next === 'dark') {
        htmlElement.setAttribute('data-theme', 'dark');
      } else {
        htmlElement.removeAttribute('data-theme');
      }

      try { localStorage.setItem('theme', next); } catch (e) { /* storage blocked */ }
      render(next);
    });
  })();
</script>
