<!-- Table of Contents (auto-generated for posts > 500 words) -->
<div id="toc-container" class="toc-container">
  <h3 class="toc-title">Table of Contents</h3>
  <nav id="toc" class="toc"></nav>
</div>

<script>
  (function() {
    // Only generate TOC if post has enough content
    const article = document.querySelector('.entry');
    const wordCount = article ? article.innerText.split(/\s+/).length : 0;

    if (wordCount > 500) {
      const headings = article.querySelectorAll('h2, h3, h4');

      if (headings.length > 2) {
        const toc = document.getElementById('toc');
        const tocContainer = document.getElementById('toc-container');
        const ul = document.createElement('ul');

        headings.forEach((heading, index) => {
          // Add ID to heading if it doesn't have one
          if (!heading.id) {
            heading.id = 'heading-' + index;
          }

          const li = document.createElement('li');
          li.className = 'toc-' + heading.tagName.toLowerCase();

          const a = document.createElement('a');
          a.href = '#' + heading.id;
          a.textContent = heading.textContent;
          a.onclick = function(e) {
            e.preventDefault();
            heading.scrollIntoView({ behavior: 'smooth' });
            // Use history.replaceState to avoid double jump from hash change
            if (history.replaceState) {
              history.replaceState(null, null, '#' + heading.id);
            } else {
              window.location.hash = heading.id;
            }
          };

          li.appendChild(a);
          ul.appendChild(li);
        });

        toc.appendChild(ul);
        tocContainer.style.display = 'block';
      }
    }
  })();
</script>
