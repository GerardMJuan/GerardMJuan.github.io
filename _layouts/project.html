---
layout: default
---

<article class="project-entry">
  <header class="project-header">
    <p class="project-kicker">Project</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}
      <p class="project-description">{{ page.description }}</p>
    {% endif %}
    {% if page.date %}
      <p class="date">Updated {{ page.date | date: "%B %-d, %Y" }}</p>
    {% endif %}
  </header>

  <div class="entry">
    {{ content }}
  </div>

  {% if page.links %}
    <nav class="project-links" aria-label="Project links">
      {% for link in page.links %}
        <a href="{{ link[1] }}">{{ link[0] }}</a>
      {% endfor %}
    </nav>
  {% endif %}
</article>
